<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N!TRO | Personal Command</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --nt-bg: #ffffff; --nt-border: #edeef0; --nt-card: #ffffff; }
        @media (prefers-color-scheme: dark) { :root { --nt-bg: #000; --nt-border: #333; --nt-card: #1c1c1e; } }

        body { background: var(--nt-bg); }
        .ws-container { padding-top: 140px; min-height: 100vh; }
        
        /* Perspective Toggles */
        .perspective-nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--nt-border); padding-bottom: 15px; }
        .p-tab { cursor: pointer; font-weight: 700; font-size: 14px; opacity: 0.4; transition: 0.3s; }
        .p-tab.active { opacity: 1; color: var(--pink); border-bottom: 2px solid var(--pink); padding-bottom: 13px; }

        /* Stats Bar */
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: var(--light-grey); padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 1px solid var(--nt-border); }
        .progress-track { flex: 1; height: 6px; background: #ddd; border-radius: 10px; margin: 0 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--pink); width: 0%; transition: 0.5s; }

        /* Input Area */
        .toolbar-pro { background: var(--nt-card); padding: 20px; border-radius: 20px; margin-bottom: 30px; border: 1px solid var(--nt-border); }
        .input-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid var(--nt-border); background: var(--nt-bg); color: var(--text); outline: none; }
        
        /* Task Cards/Table */
        .notion-grid { width: 100%; border-collapse: collapse; }
        .notion-grid th { text-align: left; padding: 15px; font-size: 11px; text-transform: uppercase; color: #888; border-bottom: 1px solid var(--nt-border); }
        .notion-grid td { padding: 15px; border-bottom: 1px solid var(--nt-border); font-size: 14px; }

        .tag { padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; font-family: var(--mono-font); display: inline-block; }
        .priority-high { background: #ffe2e2; color: #d13438; }
        .priority-med { background: #fff4ce; color: #8a660e; }
        .priority-low { background: #e2fced; color: #107c10; }
        
        .status-pill { border: none; font-weight: 800; cursor: pointer; color: var(--pink); background: transparent; }
        .delete-btn { color: #ccc; cursor: pointer; font-size: 18px; }
        .delete-btn:hover { color: var(--pink); }

        /* Login Layout */
        #login-screen { text-align: center; padding: 80px 0; }
        .acc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 40px auto; }
        .acc-pill { padding: 20px; border: 1px solid var(--nt-border); border-radius: 15px; cursor: pointer; font-weight: 700; background: var(--nt-card); transition: 0.3s; }
        .acc-pill:hover { border-color: var(--pink); transform: translateY(-3px); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" style="text-decoration:none" class="pink">← PORTFOLIO</a>
            <div id="session-info" style="font-family: var(--mono-font); font-size: 11px; opacity: 0.5;">LOCKED</div>
        </div>
    </nav>

    <div class="ws-container">
        <div class="minimal-container">

            <div id="login-screen">
                <h2 class="section-tag">N!TRO Workspace</h2>
                <p class="large-text">Choose your <span class="pink">Account.</span></p>
                <div class="acc-grid">
                    <div class="acc-pill" onclick="access('Aryeh')">Aryeh</div>
                    <div class="acc-pill" onclick="access('Anay')">Anay</div>
                    <div class="acc-pill" onclick="access('Aariv')">Aariv</div>
                    <div class="acc-pill" onclick="access('Rishaan')">Rishaan</div>
                    <div class="acc-pill" onclick="access('Vansh')">Vansh</div>
                    <div class="acc-pill" onclick="access('Aryavardhan')">Aryavardhan</div>
                </div>
            </div>

            <div id="pro-dashboard" style="display:none;">
                <div class="perspective-nav">
                    <div id="tab-all" class="p-tab active" onclick="setFilter('all')">Global Board</div>
                    <div id="tab-me" class="p-tab" onclick="setFilter('me')">My Tasks</div>
                </div>

                <div class="stats-bar">
                    <span id="progress-label" style="font-weight:800; font-size: 11px;">OVERALL COMPLETION</span>
                    <div class="progress-track"><div id="p-fill" class="progress-fill"></div></div>
                    <span id="p-percent" style="font-family: var(--mono-font); font-weight: 800; font-size: 11px;">0%</span>
                </div>

                <div class="toolbar-pro">
                    <div class="input-row">
                        <input type="text" id="t-name" placeholder="Assign new task...">
                        <select id="t-member">
                            <option value="Aryeh">Aryeh</option><option value="Anay">Anay</option>
                            <option value="Aariv">Aariv</option><option value="Rishaan">Rishaan</option>
                            <option value="Vansh">Vansh</option><option value="Aryavardhan">Aryavardhan</option>
                        </select>
                        <select id="t-priority">
                            <option value="High">High Priority</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                        <select id="t-status">
                            <option value="Todo">To-Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Done">Done</option>
                        </select>
                        <button class="nav-cta" onclick="pushTask()" style="border:none; cursor:pointer;">Add</button>
                    </div>
                </div>

                <table class="notion-grid">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Assignee</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>From</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="master-table"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let currentUser = "";
        let filterMode = "all"; // 'all' or 'me'
        let db = JSON.parse(localStorage.getItem('nitro_v3_db')) || [];

        function access(name) {
            currentUser = name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('pro-dashboard').style.display = 'block';
            document.getElementById('session-info').innerText = "OPERATOR: " + name.toUpperCase();
            refresh();
        }

        function setFilter(mode) {
            filterMode = mode;
            document.getElementById('tab-all').classList.toggle('active', mode === 'all');
            document.getElementById('tab-me').classList.toggle('active', mode === 'me');
            document.getElementById('progress-label').innerText = mode === 'all' ? "OVERALL COMPLETION" : "MY COMPLETION";
            refresh();
        }

        function pushTask() {
            const name = document.getElementById('t-name').value;
            if(!name) return;
            db.push({
                id: Date.now(),
                name: name,
                member: document.getElementById('t-member').value,
                priority: document.getElementById('t-priority').value,
                status: document.getElementById('t-status').value,
                owner: currentUser
            });
            localStorage.setItem('nitro_v3_db', JSON.stringify(db));
            document.getElementById('t-name').value = "";
            refresh();
        }

        function updateStatus(id, newStatus) {
            db = db.map(t => t.id === id ? {...t, status: newStatus} : t);
            localStorage.setItem('nitro_v3_db', JSON.stringify(db));
            refresh();
        }

        function remove(id) {
            db = db.filter(t => t.id !== id);
            localStorage.setItem('nitro_v3_db', JSON.stringify(db));
            refresh();
        }

        function refresh() {
            const table = document.getElementById('master-table');
            table.innerHTML = "";
            
            // Filter Logic
            let displayDb = filterMode === 'all' ? db : db.filter(t => t.member === currentUser);

            displayDb.forEach(t => {
                const pClass = `priority-${t.priority.toLowerCase()}`;
                const isSentByMe = t.owner === currentUser ? "(You)" : t.owner;
                table.innerHTML += `
                    <tr>
                        <td style="font-weight:600">${t.name}</td>
                        <td><span class="tag" style="background:#eee; color:#333">${t.member.toUpperCase()}</span></td>
                        <td><span class="tag ${pClass}">${t.priority}</span></td>
                        <td>
                            <select class="status-pill" onchange="updateStatus(${t.id}, this.value)">
                                <option ${t.status=='Todo'?'selected':''}>Todo</option>
                                <option ${t.status=='In Progress'?'selected':''}>In Progress</option>
                                <option ${t.status=='Done'?'selected':''}>Done</option>
                            </select>
                        </td>
                        <td style="opacity:0.4; font-size:12px">${isSentByMe}</td>
                        <td class="delete-btn" onclick="remove(${t.id})">✕</td>
                    </tr>
                `;
            });

            // Stats Logic
            const filteredDone = displayDb.filter(t => t.status === 'Done').length;
            const percent = displayDb.length > 0 ? Math.round((filteredDone / displayDb.length) * 100) : 0;
            document.getElementById('p-fill').style.width = percent + "%";
            document.getElementById('p-percent').innerText = percent + "%";
        }
    </script>
</body>
</html>
