<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N!TRO | Team Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --notion-bg: #ffffff; --notion-card: #ffffff; --notion-border: #edeef0; }
        @media (prefers-color-scheme: dark) { :root { --notion-bg: #000; --notion-card: #1c1c1e; --notion-border: #333; } }

        .workspace-body { padding-top: 120px; background: var(--notion-bg); min-height: 100vh; }
        .workspace-header { margin-bottom: 40px; border-bottom: 1px solid var(--notion-border); padding-bottom: 20px; }
        
        /* Task Input Area */
        .task-creator { background: var(--light-grey); padding: 30px; border-radius: 20px; margin-bottom: 50px; display: flex; gap: 15px; flex-wrap: wrap; }
        input, select, .btn-add { padding: 12px 20px; border-radius: 10px; border: 1px solid var(--notion-border); font-family: 'Inter', sans-serif; outline: none; }
        input { flex: 2; min-width: 200px; }
        .btn-add { background: var(--pink); color: white; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { opacity: 0.8; transform: scale(1.02); }

        /* Board Columns */
        .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; align-items: start; }
        .column { background: var(--light-grey); border-radius: 20px; padding: 20px; min-height: 500px; }
        .column h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; color: #888; }

        /* Task Cards */
        .task-card { background: var(--notion-card); padding: 18px; border-radius: 12px; border: 1px solid var(--notion-border); margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; transition: 0.2s; }
        .task-card:hover { border-color: var(--pink); }
        .task-text { font-weight: 600; margin-bottom: 10px; display: block; }
        .assignee-tag { font-family: var(--mono-font); font-size: 11px; background: var(--light-grey); padding: 4px 10px; border-radius: 5px; color: var(--navy); }
        .delete-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 14px; opacity: 0.3; }
        .delete-btn:hover { opacity: 1; color: var(--pink); }

        #login-screen { text-align: center; padding: 100px 20px; }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 800px; margin: 40px auto; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" style="text-decoration: none;"><span class="pink" style="font-weight: 800;">← EXIT TO PUBLIC SITE</span></a>
            <div id="active-user-display" style="font-family: var(--mono-font); font-size: 12px; opacity: 0.5;"></div>
        </div>
    </nav>

    <div class="workspace-body">
        <div class="minimal-container">
            
            <div id="login-screen">
                <h2 class="section-tag">Team Access</h2>
                <p class="large-text">Who is <span class="pink">assigning tasks?</span></p>
                <div class="user-grid">
                    <div class="user-pill" onclick="initWorkspace('Aryeh')">Aryeh</div>
                    <div class="user-pill" onclick="initWorkspace('Anay')">Anay</div>
                    <div class="user-pill" onclick="initWorkspace('Aariv')">Aariv</div>
                    <div class="user-pill" onclick="initWorkspace('Rishaan')">Rishaan</div>
                    <div class="user-pill" onclick="initWorkspace('Vansh')">Vansh</div>
                    <div class="user-pill" onclick="initWorkspace('Aryavardhan')">Aryavardhan</div>
                </div>
            </div>

            <div id="dashboard" style="display:none;">
                <div class="workspace-header">
                    <p class="large-text">Project <span class="pink">Sprint.</span></p>
                </div>

                <div class="task-creator">
                    <input type="text" id="taskInput" placeholder="Type a new task (e.g. Finish CAD wing)...">
                    <select id="assigneeSelect">
                        <option value="Aryeh">Assign to Aryeh</option>
                        <option value="Anay">Assign to Anay</option>
                        <option value="Aariv">Assign to Aariv</option>
                        <option value="Rishaan">Assign to Rishaan</option>
                        <option value="Vansh">Assign to Vansh</option>
                        <option value="Aryavardhan">Assign to Aryavardhan</option>
                    </select>
                    <button class="btn-add" onclick="addTask()">Assign Work</button>
                </div>

                <div class="board">
                    <div class="column">
                        <h3>Backlog / To Do</h3>
                        <div id="todo-list"></div>
                    </div>
                    <div class="column">
                        <h3>In Progress</h3>
                        <div id="progress-list">
                            <div class="task-card">
                                <span class="task-text">Website Deployment</span>
                                <span class="assignee-tag">ANAY</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('nitro_tasks')) || [];

        function initWorkspace(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('active-user-display').innerText = "SESSION: " + user.toUpperCase();
            renderTasks();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const assignee = document.getElementById('assigneeSelect');
            
            if (input.value.trim() === "") return;

            const newTask = {
                id: Date.now(),
                text: input.value,
                assignee: assignee.value
            };

            tasks.push(newTask);
            localStorage.setItem('nitro_tasks', JSON.stringify(tasks));
            input.value = "";
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('nitro_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('todo-list');
            container.innerHTML = "";
            
            tasks.forEach(task => {
                container.innerHTML += `
                    <div class="task-card">
                        <span class="delete-btn" onclick="deleteTask(${task.id})">✕</span>
                        <span class="task-text">${task.text}</span>
                        <span class="assignee-tag">${task.assignee.toUpperCase()}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
