<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N!TRO | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --nt-pink: #ff1493; --nt-bg: #ffffff; --nt-border: #edeef0; }
        @media (prefers-color-scheme: dark) { :root { --nt-bg: #000; --nt-border: #333; } }

        body { background: var(--nt-bg); color: var(--text); }
        .ws-container { padding-top: 140px; max-width: 1100px; margin: 0 auto; padding-inline: 20px; }
        
        /* APP HEADER */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .sync-status { display: flex; align-items: center; gap: 8px; background: var(--light-grey); padding: 8px 15px; border-radius: 30px; font-size: 10px; font-weight: 800; }
        .pulse-dot { width: 8px; height: 8px; background: #00ff64; border-radius: 50%; box-shadow: 0 0 10px #00ff64; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* VIEW TABS */
        .tab-row { display: flex; background: var(--light-grey); padding: 5px; border-radius: 12px; width: fit-content; margin-bottom: 30px; }
        .tab { padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; color: #888; transition: 0.3s; }
        .tab.active { background: #fff; color: var(--nt-pink); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* CREATOR BAR */
        .creator-bar { background: var(--light-grey); padding: 25px; border-radius: 24px; border: 1px solid var(--nt-border); margin-bottom: 30px; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 12px; }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid var(--nt-border); font-family: inherit; font-size: 14px; outline: none; }
        .push-btn { background: var(--nt-pink); color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .push-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3); }

        /* DATA TABLE */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { text-align: left; font-size: 11px; text-transform: uppercase; color: #aaa; padding: 15px; border-bottom: 1px solid var(--nt-border); }
        .data-table td { padding: 20px 15px; border-bottom: 1px solid var(--nt-border); font-size: 14px; }
        .tag-member { background: var(--navy); color: white; padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; }
        
        #auth-screen { text-align: center; padding-top: 100px; }
        .acc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 40px auto; }
        .acc-card { padding: 30px; border: 1px solid var(--nt-border); border-radius: 20px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .acc-card:hover { border-color: var(--nt-pink); background: var(--light-grey); transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="pink" style="text-decoration:none; font-weight:800;">← DISCONNECT</a>
            <div class="sync-status"><div class="pulse-dot"></div> <span id="sync-text">LIVE NETWORK</span></div>
        </div>
    </nav>

    <div class="ws-container">
        
        <div id="auth-screen">
            <h2 class="section-tag">Internal Access</h2>
            <p class="large-text">Identify <span class="pink">Operator.</span></p>
            <div class="acc-grid">
                <div class="acc-card" onclick="login('Aryeh')">Aryeh</div>
                <div class="acc-card" onclick="login('Anay')">Anay</div>
                <div class="acc-card" onclick="login('Aariv')">Aariv</div>
                <div class="acc-card" onclick="login('Rishaan')">Rishaan</div>
                <div class="acc-card" onclick="login('Vansh')">Vansh</div>
                <div class="acc-card" onclick="login('Aryavardhan')">Aryavardhan</div>
            </div>
        </div>

        <div id="main-app" style="display:none;">
            <div class="app-header">
                <div>
                    <h2 class="section-tag">Global Sprint</h2>
                    <p style="font-size: 2.5rem; font-weight: 800; letter-spacing: -1px;">Task <span class="pink">Database.</span></p>
                </div>
                <div class="tab-row">
                    <div id="t-all" class="tab active" onclick="setTab('all')">Team Feed</div>
                    <div id="t-me" class="tab" onclick="setTab('me')">My Focus</div>
                </div>
            </div>

            <div class="creator-bar">
                <input type="text" id="in-task" placeholder="Next engineering milestone...">
                <select id="in-mem">
                    <option>Aryeh</option><option>Anay</option><option>Aariv</option>
                    <option>Rishaan</option><option>Vansh</option><option>Aryavardhan</option>
                </select>
                <select id="in-pri">
                    <option>High</option><option>Med</option><option>Low</option>
                </select>
                <select id="in-sta">
                    <option>Todo</option><option>Doing</option><option>Done</option>
                </select>
                <button class="push-btn" onclick="submitTask()">Push</button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Requirement</th>
                        <th>Assignee</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>From</th>
                    </tr>
                </thead>
                <tbody id="db-body">
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        const PROD_URL = "https://script.google.com/macros/s/AKfycbwqwJflwiiKXPvuvx8cU6fBzVgqDP1ZZBc5Y1u9bBxoSdYKKCv_0L5UjurdUM-BADEp/exec";
        let currentUser = "";
        let currentTab = "all";

        function login(name) {
            currentUser = name;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('sync-text').innerText = "CONNECTED: " + name.toUpperCase();
            fetchData();
        }

        async function fetchData() {
            document.getElementById('sync-text').innerText = "SYNCING...";
            try {
                const response = await fetch(PROD_URL);
                const data = await response.json();
                render(data);
                document.getElementById('sync-text').innerText = "CONNECTED: " + currentUser.toUpperCase();
            } catch (e) {
                document.getElementById('sync-text').innerText = "OFFLINE - RECONNECTING";
            }
        }

        async function submitTask() {
            const taskInput = document.getElementById('in-task');
            if(!taskInput.value) return;

            const payload = {
                id: Date.now(),
                task: taskInput.value,
                member: document.getElementById('in-mem').value,
                priority: document.getElementById('in-pri').value,
                status: document.getElementById('in-sta').value,
                author: currentUser
            };

            taskInput.value = "Sending to cloud...";
            
            await fetch(PROD_URL, {
                method: 'POST',
                mode: 'no-cors', // Essential for Google Apps Script POST
                body: JSON.stringify(payload)
            });

            taskInput.value = "";
            setTimeout(fetchData, 1000); // Wait 1s for sheet to update
        }

        function render(data) {
            const body = document.getElementById('db-body');
            body.innerHTML = "";
            
            // Apply View Filter
            const displayData = currentTab === 'all' ? data : data.filter(r => r[2] === currentUser);

            displayData.reverse().forEach(row => {
                body.innerHTML += `
                    <tr>
                        <td style="font-weight:700">${row[1]}</td>
                        <td><span class="tag-member">${row[2].toUpperCase()}</span></td>
                        <td style="color:${row[3]==='High'?'#ff1493':'#888'}; font-weight:800; font-size:11px;">${row[3].toUpperCase()}</td>
                        <td class="pink" style="font-weight:800">${row[4]}</td>
                        <td style="font-size:11px; opacity:0.3">BY ${row[5]}</td>
                    </tr>
                `;
            });
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('t-all').classList.toggle('active', tab === 'all');
            document.getElementById('t-me').classList.toggle('active', tab === 'me');
            fetchData();
        }

        // Auto-refresh every 20 seconds
        setInterval(fetchData, 20000);
    </script>
</body>
</html>
